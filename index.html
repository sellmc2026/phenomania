<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florium</title>
<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #79a66e;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
}

.game-ui {
    font: 600 14px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: #f9f2d8;
}

.hud {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 3;
    padding: 10px 13px;
    background: #2a4031;
    border: 2px solid #15271b;
    box-shadow: 3px 3px 0 #1b2d1f;
    pointer-events: none;
}

.hud kbd, .pickup-label kbd {
    display: inline-block;
    min-width: 23px;
    padding: 1px 5px;
    background: #d6cba4;
    border: 1px solid #f7e9bd;
    color: #253624;
    font: inherit;
    text-align: center;
    margin-right: 6px;
}

.prompt-area {
    position: fixed;
    bottom: calc(var(--hotbar-size) + 27px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
}

.pickup-label, .toast {
    padding: 9px 13px;
    border: 2px solid #17281b;
    background: #283c2d;
    box-shadow: 3px 3px 0 #17281b;
}

.toast-area {
    position: fixed;
    top: 17px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 30;
}

/* hotbar */
:root {
    --hotbar-size: 64px;
}

.hotbar {
    position: fixed;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    z-index: 10;
    display: grid;
    grid-template-columns: repeat(9, var(--hotbar-size));
    gap: 3px;
    padding: 4px;
    background: rgba(40, 23, 55, 0.70);
    border: 2px solid #79618b;
    border-radius: 8px;
    box-shadow: 3px 3px 0 rgba(23, 13, 32, 0.65);
}

.hotbar-slot {
    width: var(--hotbar-size);
    height: var(--hotbar-size);
    position: relative;
    border: 0;
    padding: 0;
    background: #4f3565 url("hotbar-slot-unselected.png") center / 100% 100% no-repeat;
    image-rendering: pixelated;
    cursor: pointer;
}

.hotbar-slot.active {
    background-image: url("hotbar-slot-selected.png");
}

.hotbar-slot:focus-visible, .inventory-slot:focus-visible {
    outline: 2px solid #ffefac;
    outline-offset: 2px;
}

.hotbar-slot .item-icon {
    width: 64%;
    height: 64%;
    position: absolute;
    top: 18%;
    left: 18%;
}

.hotbar-number {
    position: absolute;
    top: 1px;
    left: 3px;
    color: #fff4ce;
    font-size: 16px;
    line-height: 1;
    text-shadow: 1px 1px #392244, -1px -1px #392244;
    pointer-events: none;
}

.hotbar-slot .item-quantity { font-size: 12px; }

/* inventory */
.inventory-screen {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(23, 13, 32, 0.70);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
}

[hidden] { display: none !important; }

.inventory-panel {
    width: min(560px, 100%);
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    padding: 16px;
    border: 4px solid #674d80;
    border-radius: 16px 6px 16px 6px;
    background: #d9c6ec;
    color: #352443;
    box-shadow: 6px 6px 0 #24162f, inset 0 0 0 2px #f4eaff;
}

.inventory-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 11px;
    border-radius: 8px 3px 8px 3px;
    background: #604474;
    border-bottom: 3px solid #8e729d;
    color: #fff5dd;
    font-size: 19px;
    font-weight: 800;
}

.inventory-heading small {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}

.inventory-section-title {
    margin: 12px 2px 6px;
    color: #5d4074;
    font-size: 12px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
}

.inventory-grid {
    display: grid;
    grid-template-columns: repeat(9, minmax(0, 1fr));
    gap: 5px;
    padding: 9px;
    border: 2px solid #aa91c3;
    border-radius: 10px;
    background: #c2a9db;
}

.inventory-slot {
    position: relative;
    width: 100%;
    min-width: 0;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border: 2px solid #9476b0;
    border-radius: 7px 3px 7px 3px;
    background: #f2eafb;
    padding: 2px;
    cursor: pointer;
    color: #452d58;
    touch-action: none;
}

.inventory-slot:hover {
    background: #fff7ff;
    border-color: #6fa36c;
}

.inventory-slot.selected {
    border-color: #e5bd65;
    background: #fff2ca;
    box-shadow: inset 0 0 0 1px #fff;
}

.inventory-slot.hotbar-equipped {
    box-shadow: inset 0 -3px 0 #82a576;
}

.inventory-slot.drag-over {
    border-color: #4d965b;
    background: #e4ffe3;
    outline: 2px dashed #487b48;
}

.item-icon {
    width: 115%;
    height: 115%;
    object-fit: contain;
    image-rendering: pixelated;
    user-select: none;
    pointer-events: none;
}

.item-fallback {
    font-size: 12px;
    font-weight: 900;
    pointer-events: none;
}

.item-quantity {
    position: absolute;
    bottom: -1px;
    right: -2px;
    font-size: 12px;
    font-weight: 900;
    line-height: 1;
    color: #fff;
    pointer-events: none;
    text-shadow: -1px -1px #34243e, 1px -1px #34243e,
                  -1px 1px #34243e, 1px 1px #34243e;
}

.inventory-info {
    min-height: 48px;
    margin-top: 11px;
    padding: 9px 8px 0;
    border-top: 2px solid #b49bc7;
    font-size: 13px;
}

.inventory-hint {
    margin-top: 5px;
    font-size: 12px;
    color: #685576;
}

/* right click item menu */
.item-menu {
    position: fixed;
    z-index: 40;
    width: 218px;
    padding: 11px;
    border: 3px solid #674d80;
    border-radius: 11px 4px 11px 4px;
    background: #f0e5fa;
    color: #3b2949;
    box-shadow: 4px 4px 0 #24162f;
}

.item-menu-title {
    font-size: 14px;
    font-weight: 900;
    margin-bottom: 5px;
}

.item-menu-description {
    font-size: 11px;
    margin-bottom: 10px;
    color: #685474;
}

.item-menu-actions {
    display: grid;
    gap: 6px;
}

.item-menu button {
    padding: 8px;
    border: 2px solid #7d638f;
    border-radius: 6px 2px 6px 2px;
    background: #ddcbed;
    color: #3b2949;
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
}

.item-menu button:hover { background: #fef4ff; }
.item-menu button.danger { border-color: #af647b; color: #853448; }
.item-menu button.confirm { background: #ffe2dd; }

#gameContainer {
    position: fixed;
    inset: 0;
}

#tool {
    position: absolute;
    left: 100px;
    top: 50px;
    padding-top: 5px;
    z-index: 10;
}

@media (max-width: 390px) {
    .inventory-grid { gap: 3px; padding: 5px; }
    .inventory-panel { padding: 9px; }
    .inventory-heading { font-size: 15px; }
    .inventory-heading small { font-size: 10px; }
    .inventory-slot { border-width: 1px; }
    .item-quantity { font-size: 10px; }
    .hotbar-slot .item-quantity { font-size: 10px; }
    .hotbar-number { font-size: 8px; }
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="gameContainer">
    <button id="tool">Tool</button>
</div>

<div class="game-ui">
    <div class="hud">
        <kbd>E</kbd> Inventory
    </div>

    <div class="prompt-area">
        <div class="pickup-label" id="pickup-prompt" hidden>
            <kbd>C</kbd> Pick up <span id="pickup-name">Basic Egg</span>
        </div>
    </div>

    <div class="toast-area">
        <div class="toast" id="toast" hidden></div>
    </div>

    <div class="hotbar" id="hotbar" aria-label="Hotbar"></div>

    <div class="inventory-screen" id="inventory-screen" hidden>
        <section class="inventory-panel"
                 role="dialog"
                 aria-label="Inventory"
                 aria-modal="true">

            <div class="inventory-heading">
                <span>Inventory</span>
                <small>E / ESC to close</small>
            </div>

            <div class="inventory-section-title">Backpack</div>
            <div class="inventory-grid" id="inventory-grid"></div>

            <div class="inventory-section-title">Hotbar</div>
            <div class="inventory-grid" id="inventory-hotbar-grid"></div>

            <div class="inventory-info">
                <div id="inventory-description">
                    Select an item to view it.
                </div>
                <div class="inventory-hint">
                    Drag items to rearrange, or click two slots. Right-click an item for options.
                </div>
            </div>

        </section>
    </div>

    <div class="item-menu" id="item-menu" role="dialog" aria-label="Item options" hidden>
        <div class="item-menu-title" id="item-menu-title"></div>
        <div class="item-menu-description" id="item-menu-description"></div>
        <div class="item-menu-actions">
            <button type="button" id="item-menu-drop">Drop stack</button>
            <button type="button" class="danger" id="item-menu-delete">Delete forever</button>
            <button type="button" id="item-menu-cancel">Cancel</button>
        </div>
    </div>
</div>

<script>
"use strict";



window.give = function(itemId, amount = 1) {
    addInventoryItem(itemId, amount);
    console.log(`Gave ${amount}x ${itemId}`);
};
    
// settings
let freezePlayer = false;

let developerMode = false;

const TILE_SIZE = 16;
const PIXEL_SCALE = 3;
const WALK_SPEED = 70;
const SPRINT_SPEED = 125;
const PLAYER_SPRITE_SIZE = 32;
const WALK_FRAME_DISTANCE = TILE_SIZE / 1.5;


const EGG_RARITY = 700;
const EGG_PICKUP_DISTANCE = 25;

const TREE_PUNCH_DISTANCE = 30;
const TREE_CELL_TILES = 8;
const TREE_CHANCE_PERCENT = 45;
const TREE_SIZE = 64;
const TREE_TRUNK_HALF_WIDTH = 16;
const TREE_TRUNK_DEPTH = 10;

const TREE_PUNCH_FPS = 16;
const TREE_PUNCH_FRAME_COUNT = 9;
const TREE_PUNCH_DURATION = TREE_PUNCH_FRAME_COUNT / TREE_PUNCH_FPS;

// each axe needs this many hits when used alone on an untouched tree
const TREE_CUT_HEALTH = 60;
const AXE_HIT_RANGES = {
    "axe-level-1": [5, 5],
    "axe-level-2": [3, 4],
    "axe-level-3": [1, 3]
};
const CUT_TREES_SAVE_KEY = "pixelPetGame.cutTrees.v1";

const HOTBAR_SLOTS = 9;
const INVENTORY_SLOTS = 36;
const SAVE_KEY = "pixelPetGame.inventory.v3";
const PREVIOUS_SAVE_KEY = "pixelPetGame.inventory.v2";
const LEGACY_SAVE_KEY = "pixelPetGame.eggsAndInventory.v1";

const malePunchingLeft = loadImage(
    "characters/male/male-punching.png"
);

const malePunchingRight = loadImage(
    "characters/male/male-punching-right.png"
);


function drawPlayerSpriteFrame(
    image, frame, x, y, size = 32
) {
    const frameSize = 16;

    ctx.drawImage(
        image,
        frame * frameSize, 0,
        frameSize, frameSize,
        x, y,
        size, size
    );
}
// shadows
function drawShadow(ctx, x, y, width, height, options = {}) {
    const {
        enabled = true,
        opacity = 0.25,
        scale = 0.7,
        offsetX = 0,
        offsetY = -2
    } = options;

    if (!enabled) return;

    ctx.save();
    ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`;
    ctx.beginPath();

    ctx.ellipse(
        x + width / 2 + offsetX,
        y + height + offsetY,
        width * scale / 2,
        Math.max(1, height * 0.12),
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.restore();
}
// items
const ITEM_DEFINITIONS = {
    "basic-egg": {
        name: "Basic Egg",
        nameColor: "#ffffff",
        icon: "items/basic-egg.png",
        maxStack: 52
    },
    "axe-level-1": {
        name: "Axe ʟᴇᴠᴇʟ 1",
        nameColor: "#ffffff",
        icon: "items/axe-level-1.png",
        maxStack: 1,
    },
    "axe-level-2": {
        name: "Axe ʟᴇᴠᴇʟ 2",
        nameColor: "#FCAED9",
        icon: "items/axe-level-2.png",
        maxStack: 1,
    },
    "axe-level-3": {
        name: "Axe ʟᴇᴠᴇʟ 3",
        nameColor: "#F9D895",
        icon: "items/axe-level-3.png",
        maxStack: 1,
    },
    "wood": {
        name: "Wood",
        nameColor: "#C99B6A",
        icon: "items/log.png",
        maxStack: 64
    }
};

function getItemDefinition(itemId) {
    return ITEM_DEFINITIONS[itemId] || {
        name: itemId
            .replace(/[-_]/g, " ")
            .replace(/\b\w/g, char => char.toUpperCase()),
        icon: `items/${itemId}.png`,
        maxStack: 52
    };
}
// setup
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });
const keys = new Set();

const ui = {
    pickup: document.getElementById("pickup-prompt"),
    toast: document.getElementById("toast"),
    screen: document.getElementById("inventory-screen"),
    grid: document.getElementById("inventory-grid"),
    invHotbar: document.getElementById("inventory-hotbar-grid"),
    hotbar: document.getElementById("hotbar"),
    pickupName: document.getElementById("pickup-name"),
    description: document.getElementById("inventory-description"),
    menu: document.getElementById("item-menu"),
    menuTitle: document.getElementById("item-menu-title"),
    menuDescription: document.getElementById("item-menu-description"),
    menuDrop: document.getElementById("item-menu-drop"),
    menuDelete: document.getElementById("item-menu-delete"),
    menuCancel: document.getElementById("item-menu-cancel")
};

const player = {
    x: -16,
    y: -16,
    width: 12,
    height: 6,
    facing: "down",
    forwardSide: "left",
    moving: false,
    walkDistance: 0,
    walkFrame: 0,
    shadow: true
};

const inventory = Array(INVENTORY_SLOTS).fill(null);
const collectedEggs = new Set();
const droppedItems = [];
const itemTextures = new Map();

let nextDropId = 1;
let inventoryOpen = false;
let selectedSlot = -1;
let selectedHotbarSlot = 0;
let draggedSlot = -1;
let menuSlot = -1;
let deleteConfirm = false;
let gameTime = 0;
let notificationTime = 0;
// notifications
function showMessage(message) {
    ui.toast.textContent = message;
    ui.toast.hidden = false;
    notificationTime = 2.4;
}
// save / load
function saveGame() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            inventory,
            collectedEggs: Array.from(collectedEggs),
            droppedItems,
            selectedHotbarSlot
        }));
    } catch (error) {
        console.warn("Unable to save game:", error);
    }
}

function loadGame() {
    try {
        let source = SAVE_KEY;
        let raw = localStorage.getItem(SAVE_KEY);

        if (!raw) {
            source = PREVIOUS_SAVE_KEY;
            raw = localStorage.getItem(source);
        }

        if (!raw) {
            source = LEGACY_SAVE_KEY;
            raw = localStorage.getItem(source);
        }

        if (!raw) return;

        const data = JSON.parse(raw);

        if (Array.isArray(data.inventory)) {
            for (let i = 0; i < Math.min(INVENTORY_SLOTS, data.inventory.length); i++) {
                const old = data.inventory[i];
                if (!old) continue;

                const oldId = old.itemId || old.type;
                const itemId = oldId === "egg" ? "basic-egg" : oldId;
                if (!validItemId(itemId)) continue;

                const limit = getItemDefinition(itemId).maxStack;
                if (!Number.isInteger(old.count) || old.count < 1 || old.count > limit) continue;

                inventory[i] = { itemId, count: old.count };
            }
        }

        if (Array.isArray(data.collectedEggs)) {
            for (const key of data.collectedEggs) {
                if (typeof key === "string") collectedEggs.add(key);
            }
        }

        if (Array.isArray(data.droppedItems)) {
            for (const item of data.droppedItems) {
                if (!item || !validItemId(item.itemId)) continue;
                if (!Number.isFinite(item.x) || !Number.isFinite(item.y)) continue;
                if (!Number.isInteger(item.count) || item.count <= 0) continue;
                if (!Number.isInteger(item.id) || item.id < 1) continue;

                droppedItems.push({
                    id: item.id,
                    itemId: item.itemId,
                    x: item.x,
                    y: item.y,
                    count: item.count
                });
                nextDropId = Math.max(nextDropId, item.id + 1);
            }
        }

        if (Number.isInteger(data.selectedHotbarSlot)) {
            selectedHotbarSlot = Math.max(0, Math.min(8, data.selectedHotbarSlot));
        }

        if (source !== SAVE_KEY) saveGame();
    } catch (error) {
        console.warn("Unable to load saved game:", error);
    }
}

// items and inventory
function validItemId(itemId) {
    return typeof itemId === "string" && /^[a-z0-9_-]+$/i.test(itemId);
}

function getItemTexture(itemId) {
    if (!itemTextures.has(itemId)) {
        itemTextures.set(itemId, loadImage(getItemDefinition(itemId).icon));
    }
    return itemTextures.get(itemId);
}

function addInventoryItem(itemId, amount = 1) {
    if (!validItemId(itemId) || !Number.isInteger(amount) || amount <= 0) return false;

    const limit = getItemDefinition(itemId).maxStack;
    let capacity = 0;

    for (const slot of inventory) {
        if (!slot) capacity += limit;
        else if (slot.itemId === itemId) capacity += Math.max(0, limit - slot.count);
    }

    if (capacity < amount) return false;

    // fill existing stacks first
    for (const slot of inventory) {
        if (!slot || slot.itemId !== itemId || amount === 0) continue;
        const moved = Math.min(limit - slot.count, amount);
        slot.count += moved;
        amount -= moved;
    }

    // then fill empty slots
    for (let i = 0; i < inventory.length && amount > 0; i++) {
        if (inventory[i]) continue;
        const moved = Math.min(limit, amount);
        inventory[i] = { itemId, count: moved };
        amount -= moved;
    }

    saveGame();
    renderInventory();
    renderHotbar();
    return true;
}

function moveInventoryItem(from, to) {
    if (!Number.isInteger(from) || !Number.isInteger(to)) return;
    if (from < 0 || to < 0 || from >= INVENTORY_SLOTS || to >= INVENTORY_SLOTS) return;
    if (from === to || !inventory[from]) return;

    const first = inventory[from];
    const second = inventory[to];

    if (second && second.itemId === first.itemId) {
        const limit = getItemDefinition(first.itemId).maxStack;
        const moved = Math.max(0, Math.min(limit - second.count, first.count));
        second.count += moved;
        first.count -= moved;
        if (first.count <= 0) inventory[from] = null;
    } else {
        inventory[from] = second;
        inventory[to] = first;
    }

    saveGame();
    renderInventory();
    renderHotbar();
}

function selectHotbarSlot(index) {
    if (!Number.isInteger(index) || index < 0 || index >= HOTBAR_SLOTS) return;
    selectedHotbarSlot = index;
    saveGame();
    renderHotbar();
    if (inventoryOpen) renderInventory();
}

function getHeldItem() {
    return inventory[selectedHotbarSlot];
}

function clickInventorySlot(index) {
    closeItemMenu();

    if (selectedSlot === -1) {
        if (inventory[index]) selectedSlot = index;
    } else if (selectedSlot === index) {
        selectedSlot = -1;
    } else {
        const from = selectedSlot;
        selectedSlot = -1;
        moveInventoryItem(from, index);
    }

    renderInventory();
}

function createItemIcon(itemId) {
    const def = getItemDefinition(itemId);
    const icon = document.createElement("img");
    icon.className = "item-icon";
    icon.src = def.icon;
    icon.alt = "";
    icon.draggable = false;

    icon.addEventListener("error", () => {
        const fallback = document.createElement("span");
        fallback.className = "item-fallback";
        fallback.textContent = def.name.slice(0, 2).toUpperCase();
        icon.replaceWith(fallback);
    }, { once: true });

    return icon;
}

function fillSlot(button, index) {
    const slot = inventory[index];
    if (!slot) return;

    const def = getItemDefinition(slot.itemId);
    button.title = `${def.name} ×${slot.count}`;
    button.setAttribute("aria-label", `${def.name} x${slot.count}, slot ${index + 1}`);
    button.appendChild(createItemIcon(slot.itemId));

    if (slot.count > 1) {
        const count = document.createElement("span");
        count.className = "item-quantity";
        count.textContent = String(slot.count);
        button.appendChild(count);
    }

    button.addEventListener("contextmenu", event => {
        event.preventDefault();
        event.stopPropagation();
        showItemMenu(index, event.clientX, event.clientY);
    });
}

function createInventorySlot(index) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "inventory-slot";
    if (selectedSlot === index) button.classList.add("selected");
    if (index === selectedHotbarSlot) button.classList.add("hotbar-equipped");
    button.setAttribute("aria-label", `Inventory slot ${index + 1}`);

    fillSlot(button, index);
    button.draggable = Boolean(inventory[index]);

    button.addEventListener("click", () => clickInventorySlot(index));
    button.addEventListener("dragstart", event => {
        if (!inventory[index]) {
            event.preventDefault();
            return;
        }
        closeItemMenu();
        draggedSlot = index;
        event.dataTransfer.setData("text/plain", String(index));
        event.dataTransfer.effectAllowed = "move";
    });

    button.addEventListener("dragover", event => {
        if (draggedSlot < 0) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        button.classList.add("drag-over");
    });

    button.addEventListener("dragleave", () => button.classList.remove("drag-over"));

    button.addEventListener("drop", event => {
        event.preventDefault();
        const from = draggedSlot;
        draggedSlot = -1;
        selectedSlot = -1;

// ground hash
function hash(x, y) {
    let h =
        Math.imul(x, 374761393) +
        Math.imul(y, 668265263);

    h = Math.imul(
        h ^ (h >>> 13),
        1274126177
    );

    return (h ^ (h >>> 16)) >>> 0;
}
// draw ground
function drawGround(cameraX, cameraY) {
    ctx.fillStyle = "#79a66e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const left = Math.floor(cameraX / TILE_SIZE);
    const top = Math.floor(cameraY / TILE_SIZE);

    const right = Math.floor(
        (cameraX + canvas.width) / TILE_SIZE
    ) + 1;

    const bottom = Math.floor(
        (cameraY + canvas.height) / TILE_SIZE
    ) + 1;

    for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
            const px = Math.floor(tx * TILE_SIZE - cameraX);
            const py = Math.floor(ty * TILE_SIZE - cameraY);
            const n = hash(tx, ty);

            if (imageReady(grassTexture)) {
                ctx.drawImage(
                    grassTexture,
                    px, py,
                    TILE_SIZE + 30,
                    TILE_SIZE + 30
                );
            }

            if (n % 13 === 0) {
                ctx.fillStyle = "#98ba7b";
                ctx.fillRect(px + 6, py + 9, 2, 3);
            }

            if (n % 23 === 0) {
                ctx.fillStyle = "#648e5e";
                ctx.fillRect(px + 11, py + 12, 2, 2);
            }
        }
    }
}

function getTreeInCell(cx, cy) {
    const key = `${cx},${cy}`;

    if (cutTrees.has(key)) return null;

    if (treeCache.has(key)) {
        return treeCache.get(key);
    }

    const seed = hash(cx + 17031, cy - 90217);

    if (seed % 100 >= TREE_CHANCE_PERCENT) {
        return null;
    }

    const tx =
        cx * TREE_CELL_TILES + 1 +
        (hash(cx + 317, cy + 991) % (TREE_CELL_TILES - 2));

    const ty =
        cy * TREE_CELL_TILES + 1 +
        (hash(cx - 733, cy + 1441) % (TREE_CELL_TILES - 2));

    const x = tx * TILE_SIZE + TILE_SIZE / 2;
    const y = ty * TILE_SIZE + TILE_SIZE / 2;

    if (isNearPlot(x, y, TREE_SIZE / 2 + 6)) {
        return null;
    }

    if (Math.hypot(x + 16, y + 16) < 48) {
        return null;
    }

    const tree = {
        key,
        cx,
        cy,
        x,
        y,
        punching: false,
        cutting: false,
        cutDamage: 0,
        animation: null
    };

    treeCache.set(key, tree);

    return tree;
}

function getTreesInBounds(left, top, right, bottom) {
    const cellSize = TREE_CELL_TILES * TILE_SIZE;
    const trees = [];

    for (
        let cy = Math.floor(top / cellSize);
        cy <= Math.floor(bottom / cellSize);
        cy++
    ) {
        for (
            let cx = Math.floor(left / cellSize);
            cx <= Math.floor(right / cellSize);
            cx++
        ) {
            const tree = getTreeInCell(cx, cy);

            if (
                tree &&
                tree.x >= left &&
                tree.x <= right &&
                tree.y >= top &&
                tree.y <= bottom
            ) {
                trees.push(tree);
            }
        }
    }

    return trees;
}
// tree collision
function isTreeSolid(x, y) {
    const cellSize = TREE_CELL_TILES * TILE_SIZE;
    const cx = Math.floor(x / cellSize);
    const cy = Math.floor(y / cellSize);

    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            const tree = getTreeInCell(cx + dx, cy + dy);

            if (!tree) continue;

            if (
                Math.abs(x - tree.x) <= TREE_TRUNK_HALF_WIDTH &&
                y >= tree.y - TREE_TRUNK_DEPTH &&
                y <= tree.y
            ) {
                return true;
            }
        }
    }

    return false;
}

// trees differ in hardness, but each axe always stays in its promised hit range
function getTreeHitsForAxe(tree, axeId) {
    const range = AXE_HIT_RANGES[axeId];
    if (!range) return null;
    const [minHits, maxHits] = range;
    if (minHits === maxHits) return minHits;

    const seed = hash(
        tree.cx + (axeId === "axe-level-2" ? 19317 : 72583),
        tree.cy - (axeId === "axe-level-2" ? 6319 : 29011)
    );
    return minHits + (seed % (maxHits - minHits + 1));
}

}

// find nearest tree
function getNearestTree() {
    let nearest = null;

    let nearestDistanceSq =
        TREE_PUNCH_DISTANCE * TREE_PUNCH_DISTANCE;

    const trees = getTreesInBounds(
        player.x - TREE_PUNCH_DISTANCE,
        player.y - TREE_PUNCH_DISTANCE,
        player.x + TREE_PUNCH_DISTANCE,
        player.y + TREE_PUNCH_DISTANCE
    );

    for (const tree of trees) {
        const dx = tree.x - player.x;
        const dy = tree.y - player.y;

        const distanceSq = dx * dx + dy * dy;

        if (distanceSq <= nearestDistanceSq) {
            nearest = tree;
            nearestDistanceSq = distanceSq;
        }
    }

    return nearest;
}
// draw tree
function drawTree(tree, cameraX, cameraY) {
    const x = Math.round(tree.x - cameraX);
    const y = Math.round(tree.y - cameraY);

    let texture = treeTexture;
    let flip = false;
    const animation = tree.animation;

    if (animation) {
        const elapsed = (performance.now() - animation.startedAt) / 1000;
        const frameIndex = Math.floor(elapsed * TREE_PUNCH_FPS);

        if (frameIndex < TREE_PUNCH_FRAME_COUNT) {
            texture = treePunchFrames[frameIndex];
            flip = animation.flip;
        } else {
            tree.animation = null;
            tree.punching = false;
        }
    
    } else if (tree.cutStage === 5) {
        texture = treeCutImages[4];
    } else if (tree.cutStage >= 1 && tree.cutStage <= 4) {
        texture = treeCutImages[tree.cutStage - 1];
    }
    

    if (!imageReady(texture)) return;

    ctx.save();
    ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
    ctx.beginPath();
    ctx.ellipse(x, y - 8, 16, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(
        texture,
        -TREE_SIZE / 2,
        -TREE_SIZE,
        TREE_SIZE,
        TREE_SIZE
    );
    ctx.restore();
}
// player movement collision
function canMoveTo(x, y) {
    const halfW = player.width / 2;
    const halfH = player.height / 2;

    return !(
        isPositionSolid(x - halfW, y - halfH) ||
        isTreeSolid(x - halfW, y - halfH) ||

        isPositionSolid(x + halfW, y - halfH) ||
        isTreeSolid(x + halfW, y - halfH) ||

        isPositionSolid(x - halfW, y + halfH) ||
        isTreeSolid(x - halfW, y + halfH) ||

        isPositionSolid(x + halfW, y + halfH) ||
        isTreeSolid(x + halfW, y + halfH)
    );
}
// rare ground eggs
function getEggAtTile(tx, ty) {
    if (

    ) {

    const x = tx * TILE_SIZE + TILE_SIZE / 2;
    const y = ty * TILE_SIZE + TILE_SIZE / 2;

    if (isNearPlot(x, y)) return null;

    const key = `${tx},${ty}`;

    return { x, y, key };
}

function getNearestEgg() {
    const tx = Math.floor(player.x / TILE_SIZE);
    const ty = Math.floor(player.y / TILE_SIZE);

    let nearest = null;

    let nearestDistanceSq =
        EGG_PICKUP_DISTANCE * EGG_PICKUP_DISTANCE;

    for (let y = ty - 2; y <= ty + 2; y++) {
        for (let x = tx - 2; x <= tx + 2; x++) {
            const egg = getEggAtTile(x, y);

            if (!egg) continue;

            const dx = egg.x - player.x;
            const dy = egg.y - player.y;
            const distanceSq = dx * dx + dy * dy;

            if (distanceSq <= nearestDistanceSq) {
                nearest = egg;
                nearestDistanceSq = distanceSq;
            }
        }
    }

    return nearest;
}

function getNearestGroundItem() {
    const egg = getNearestEgg();
    let result = egg ? { type: "egg", itemId: "basic-egg", count: 1, egg } : null;
    let nearestDistanceSq = egg
        ? (egg.x - player.x) ** 2 + (egg.y - player.y) ** 2
        : EGG_PICKUP_DISTANCE * EGG_PICKUP_DISTANCE;

    for (const item of droppedItems) {

        if (distanceSq > nearestDistanceSq) continue;

        const sy = Math.round(item.y - cameraY);
        if (sx < -20 || sy < -20 || sx > canvas.width + 20 || sy > canvas.height + 20) continue;

        const bob = Math.round(Math.sin(gameTime * 3 + item.id) * 1.5);
        const texture = getItemTexture(item.itemId);
        drawShadow(ctx, sx - 8, sy - 10, 16, 16, {
            opacity: 0.25, scale: 0.75, offsetY: 2
        });

        if (imageReady(texture)) {
            ctx.drawImage(texture, sx - 8, sy - 10 + bob, 16, 16);
        } else {
            ctx.fillStyle = "#d6b0ec";
            ctx.fillRect(sx - 5, sy - 7 + bob, 10, 10);
        }
    }
}

function drawEggs(cameraX, cameraY) {
    const left = Math.floor(cameraX / TILE_SIZE) - 1;
    const top = Math.floor(cameraY / TILE_SIZE) - 1;

    const right = Math.floor(
        (cameraX + canvas.width) / TILE_SIZE
    ) + 1;

    const bottom = Math.floor(
        (cameraY + canvas.height) / TILE_SIZE
    ) + 1;

    for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
            const egg = getEggAtTile(tx, ty);

            if (!egg) continue;

            const x = Math.round(egg.x - cameraX);
            const y = Math.round(egg.y - cameraY);

            const bob = Math.round(
                Math.sin(gameTime * 2.5 + tx) * 1.2
            );

            drawShadow(ctx, x - 8, y - 10, 16, 16, {
                enabled: true,
                opacity: 0.25,
                scale: 0.75,
                offsetY: 2
            });

            if (imageReady(basicEggTexture)) {
                ctx.drawImage(
                    basicEggTexture,
                    x - 8,
                    y - 10 + bob,
                    16,
                    16
                );
            }

            const pulse =
                Math.sin(gameTime * 3 + ty) > 0.5;

            if (pulse) {
                ctx.fillStyle = "#fff2a9";

                ctx.fillRect(
                    x + 9,
                    y - 10 + bob,
                    2,
                    2
                );

                ctx.fillRect(
                    x + 10,
                    y - 12 + bob,
                    1,
                    1
                );
            }
        }
    }
}
// player sprite selection
function getPlayerSprite() {
    let direction = player.facing;

    if (direction === "down") {
        direction = player.forwardSide === "right"
            ? "downRight"
            : "downLeft";
    }

    const sprites =
        playerSprites[direction] || playerSprites.downLeft;

    const running =
        keys.has("ShiftLeft") || keys.has("ShiftRight");

    let preferred;

    if (!player.moving) {
        preferred = sprites.idle;
    } else if (running) {
        preferred = sprites.running[player.walkFrame];
    } else {
        preferred = sprites.walking[player.walkFrame];
    }

    if (!imageReady(preferred)) {
        preferred =
            sprites.walking[player.walkFrame] || sprites.idle;
    }

    return preferred;
}
// draw player
function drawPlayer(screenX, screenY) {
    const size = PLAYER_SPRITE_SIZE;

    const px = Math.floor(screenX - size / 2);
    const py = Math.floor(screenY - size + 4);

    const sprite = getPlayerSprite();

    const shadowX = screenX;
    const shadowY = screenY + 1;
    const shadowWidth = 12;
    const shadowHeight = 4;
    const shadowOpacity = 0.22;

    if (player.cutting) {
        const elapsed = performance.now() - player.cutStartedAt;
        const frame = Math.floor(elapsed / (1000 / AXE_FPS));
    
        if (frame < AXE_FRAME_COUNT && imageReady(maleAxeLeft)) {
            drawPlayerSpriteFrame(
                maleAxeLeft,
                frame,
                px,
                py,
                PLAYER_SPRITE_SIZE
            );
            return;
        }
    }

    
    if (player.punching) {
        freezePlayer = true;
    
        const elapsed = performance.now() - player.punchStartedAt;
        const frame = Math.floor(elapsed / 50);
    
        const punchRight =
            player.facing === "right" ||
            (player.facing === "down" && player.forwardSide === "right");
    
        const punchSprite = punchRight
            ? malePunchingRight
            : malePunchingLeft;
    
        if (frame < 10 && imageReady(punchSprite)) {
            drawPlayerSpriteFrame(
                punchSprite,
                frame,
                px,
                py,
                PLAYER_SPRITE_SIZE
            );
            return;
        }
    
        player.punching = false;
        freezePlayer = false;
    }

    
        if (player.shadow) {
            ctx.save();
    
            ctx.fillStyle = `rgba(0, 0, 0, ${shadowOpacity})`;
    
            ctx.beginPath();
            ctx.ellipse(
                shadowX,
                shadowY,
                shadowWidth,
                shadowHeight,
                0,
                0,
                Math.PI * 2
            );
    
            ctx.fill();
            ctx.restore();
        }
    
        if (imageReady(sprite)) {
            ctx.drawImage(sprite, px, py, size, size);
        }
    }
// update ui
function updateUI(dt) {
    if (notificationTime > 0) {
        notificationTime -= dt;

        if (notificationTime <= 0) {
            ui.toast.hidden = true;
        }
    }

    if (!inventoryOpen) {
        const nearby = getNearestGroundItem();
        ui.pickup.hidden = !nearby;
        if (nearby) {
            ui.pickupName.textContent = getItemDefinition(nearby.itemId).name +
                (nearby.count > 1 ? ` ×${nearby.count}` : "");
        }
    }
}
// update game
function update(dt) {
    gameTime += dt;
    updateUI(dt);

    if (inventoryOpen) {
        player.moving = false;
        player.walkDistance = 0;
        player.walkFrame = 0;
        return;
    }

    if (player.punching || player.cutting) {
        player.moving = false;
        return;
    }            
        
    const inputX =
        Number(
            keys.has("KeyD") ||
            keys.has("ArrowRight")
        ) -
        Number(
            keys.has("KeyA") ||
            keys.has("ArrowLeft")
        );

    const inputY =
        Number(
            keys.has("KeyS") ||
            keys.has("ArrowDown")
        ) -
        Number(
            keys.has("KeyW") ||
            keys.has("ArrowUp")
        );

    if (inputX === 0 && inputY === 0) {
        player.moving = false;
        player.walkDistance = 0;
        player.walkFrame = 0;
        return;
    }

    const length = Math.hypot(inputX, inputY);

    const dx = inputX / length;
    const dy = inputY / length;

    const speed =
        keys.has("ShiftLeft") || keys.has("ShiftRight")
            ? SPRINT_SPEED
            : WALK_SPEED;

    const moveX = dx * speed * dt;
    const moveY = dy * speed * dt;

    const previousX = player.x;
    const previousY = player.y;

    if (canMoveTo(player.x + moveX, player.y)) {
        player.x += moveX;
    }

    if (canMoveTo(player.x, player.y + moveY)) {
        player.y += moveY;
    }

    if (inputY !== 0) {
        player.facing = inputY > 0 ? "down" : "up";
    } else {
        player.facing = inputX > 0 ? "right" : "left";
    }

    const distanceMoved = Math.hypot(
        player.x - previousX,
        player.y - previousY
    );

    player.moving = distanceMoved > 0.0001;

    if (player.moving) {
        player.walkDistance += distanceMoved;

        player.walkFrame = Math.floor(
            player.walkDistance / WALK_FRAME_DISTANCE
        ) % 2;
    } else {
        player.walkDistance = 0;
        player.walkFrame = 0;
    }
}
// draw game
function draw() {
    const cameraX = Math.round(
        player.x - canvas.width / 2
    );

    const cameraY = Math.round(
        player.y - canvas.height / 2
    );

    drawGround(cameraX, cameraY);
    drawEggs(cameraX, cameraY);
    drawDroppedItems(cameraX, cameraY);

    const trees = getTreesInBounds(
        cameraX - TREE_SIZE,
        cameraY - TREE_SIZE,
        cameraX + canvas.width + TREE_SIZE,
        cameraY + canvas.height + TREE_SIZE
    );

    for (const tree of trees) {
        if (tree.y <= player.y) {
            drawTree(tree, cameraX, cameraY);
        }
    }

    drawPlayer(
        Math.floor(canvas.width / 2),
        Math.floor(canvas.height / 2)
    );

    for (const tree of trees) {
        if (tree.y > player.y) {
            drawTree(tree, cameraX, cameraY);
        }
    }

    drawHitboxes(cameraX, cameraY);
}
// game loop
let lastTime = performance.now();

function gameLoop(now) {
    const dt = Math.min(
        (now - lastTime) / 1000,
        0.05
    );

    lastTime = now;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
// controls
window.addEventListener("keydown", (event) => {

    if (event.ctrlKey && event.code === "KeyO") {
        event.preventDefault();

        if (!event.repeat) {
            developerMode = !developerMode;

            console.log(
                "Developer Mode:",
                developerMode ? "ON" : "OFF"
            );
        }

        return;
    }

    if (
        [
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
        ].includes(event.code)
    ) {
        event.preventDefault();
    }

    if (event.code === "Escape" && !ui.menu.hidden) {
        event.preventDefault();
        closeItemMenu();
        return;
    }

    if (!event.ctrlKey && !event.altKey && !event.metaKey && /^Digit[1-9]$/.test(event.code)) {
        event.preventDefault();
        if (!event.repeat) selectHotbarSlot(Number(event.code.slice(-1)) - 1);
        return;
    }

    if (
        event.code === "KeyE" ||
        event.code === "Escape"
    ) {
        event.preventDefault();

        if (!event.repeat) {
            if (event.code === "KeyE") {
                toggleInventory();
            } else if (inventoryOpen) {
                toggleInventory(false);
            }
        }

        return;
    }

    if (inventoryOpen) return;

    if (event.code === "KeyZ" || "Enter") {
        event.preventDefault();
    
        keys.add("KeyZ");
        keys.add("Enter");
    
        if (!event.repeat) {
            const tree = getNearestTree();
    
            if (tree) {
                const heldItemId = getHeldItem()?.itemId;
    
                if (AXE_HIT_RANGES[heldItemId]) {
                    holdToCutTree(tree);
                } else {
                    punchTree(tree);
                }
            }
        }
    
        return;
    }

    if (event.code === "KeyC") {
        event.preventDefault();

        if (!event.repeat) {
            collectNearbyItem();
        }

        return;
    }

    if (!keys.has(event.code)) {
        if (
            event.code === "KeyD" ||
            event.code === "ArrowRight"
        ) {
            player.forwardSide = "right";
        } else if (
            event.code === "KeyA" ||
            event.code === "ArrowLeft"
        ) {
            player.forwardSide = "left";
        }
        
    }

    keys.add(event.code);
});

window.addEventListener("keydown", (event) => {
    if (event.code === "KeyF") {
        console.log("User pressed the F key... very cool!");
    }
});

window.addEventListener("keyup", (event) => {
    keys.delete(event.code);
});

window.addEventListener("blur", () => {
    keys.clear();

    player.moving = false;
    player.walkDistance = 0;
    player.walkFrame = 0;
});
// developer hitbox rendering
function drawHitboxes(cameraX, cameraY) {
    if (!developerMode) return;

    ctx.save();
    ctx.lineWidth = 1;

    ctx.strokeStyle = "#ff0000";

    ctx.strokeRect(
        Math.round(player.x - player.width / 2 - cameraX),
        Math.round(player.y - player.height / 2 - cameraY),
        player.width,
        player.height
    );

    const trees = getTreesInBounds(
        cameraX - TREE_SIZE,
        cameraY - TREE_SIZE,
        cameraX + canvas.width + TREE_SIZE,
        cameraY + canvas.height + TREE_SIZE
    );

    ctx.strokeStyle = "#0088ff";

    for (const tree of trees) {
        ctx.strokeRect(
            Math.round(tree.x - TREE_TRUNK_HALF_WIDTH - cameraX),
            Math.round(tree.y - TREE_TRUNK_DEPTH - cameraY),
            TREE_TRUNK_HALF_WIDTH * 2,
            TREE_TRUNK_DEPTH
        );
    }

    ctx.restore();
}
</script>
