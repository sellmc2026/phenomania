<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phenomania</title>
<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #79a66e;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
}

.game-ui {
    font: 600 14px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: #f9f2d8;
}

.hud {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 3;
    padding: 10px 13px;
    background: #2a4031;
    border: 2px solid #15271b;
    box-shadow: 3px 3px 0 #1b2d1f;
    pointer-events: none;
}

.hud kbd, .pickup-label kbd {
    display: inline-block;
    min-width: 23px;
    padding: 1px 5px;
    background: #d6cba4;
    border: 1px solid #f7e9bd;
    color: #253624;
    font: inherit;
    text-align: center;
    margin-right: 6px;
}

.prompt-area {
    position: fixed;
    bottom: calc(var(--hotbar-size) + 27px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
}

.pickup-label, .toast {
    padding: 9px 13px;
    border: 2px solid #17281b;
    background: #283c2d;
    box-shadow: 3px 3px 0 #17281b;
}

.toast-area {
    position: fixed;
    top: 17px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 30;
}

/* hotbar */
:root {
    --hotbar-size: 64px;
}

.hotbar {
    position: fixed;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    z-index: 10;
    display: grid;
    grid-template-columns: repeat(9, var(--hotbar-size));
    gap: 3px;
    padding: 4px;
    background: rgba(40, 23, 55, 0.70);
    border: 2px solid #79618b;
    border-radius: 8px;
    box-shadow: 3px 3px 0 rgba(23, 13, 32, 0.65);
}

.hotbar-slot {
    width: var(--hotbar-size);
    height: var(--hotbar-size);
    position: relative;
    border: 0;
    padding: 0;
    background: #4f3565 url("hotbar-slot-unselected.png") center / 100% 100% no-repeat;
    image-rendering: pixelated;
    cursor: pointer;
}

.hotbar-slot.active {
    background-image: url("hotbar-slot-selected.png");
}

.hotbar-slot:focus-visible, .inventory-slot:focus-visible {
    outline: 2px solid #ffefac;
    outline-offset: 2px;
}

.hotbar-slot .item-icon {
    width: 64%;
    height: 64%;
    position: absolute;
    top: 18%;
    left: 18%;
}

.hotbar-number {
    position: absolute;
    top: 1px;
    left: 3px;
    color: #fff4ce;
    font-size: 16px;
    line-height: 1;
    text-shadow: 1px 1px #392244, -1px -1px #392244;
    pointer-events: none;
}

.hotbar-slot .item-quantity { font-size: 12px; }

/* inventory */
.inventory-screen {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(23, 13, 32, 0.70);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
}

[hidden] { display: none !important; }

.inventory-panel {
    width: min(560px, 100%);
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    padding: 16px;
    border: 4px solid #674d80;
    border-radius: 16px 6px 16px 6px;
    background: #d9c6ec;
    color: #352443;
    box-shadow: 6px 6px 0 #24162f, inset 0 0 0 2px #f4eaff;
}

.inventory-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 11px;
    border-radius: 8px 3px 8px 3px;
    background: #604474;
    border-bottom: 3px solid #8e729d;
    color: #fff5dd;
    font-size: 19px;
    font-weight: 800;
}

.inventory-heading small {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}

.inventory-section-title {
    margin: 12px 2px 6px;
    color: #5d4074;
    font-size: 12px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
}

.inventory-grid {
    display: grid;
    grid-template-columns: repeat(9, minmax(0, 1fr));
    gap: 5px;
    padding: 9px;
    border: 2px solid #aa91c3;
    border-radius: 10px;
    background: #c2a9db;
}

.inventory-slot {
    position: relative;
    width: 100%;
    min-width: 0;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border: 2px solid #9476b0;
    border-radius: 7px 3px 7px 3px;
    background: #f2eafb;
    padding: 2px;
    cursor: pointer;
    color: #452d58;
    touch-action: none;
}

.inventory-slot:hover {
    background: #fff7ff;
    border-color: #6fa36c;
}

.inventory-slot.selected {
    border-color: #e5bd65;
    background: #fff2ca;
    box-shadow: inset 0 0 0 1px #fff;
}

.inventory-slot.hotbar-equipped {
    box-shadow: inset 0 -3px 0 #82a576;
}

.inventory-slot.drag-over {
    border-color: #4d965b;
    background: #e4ffe3;
    outline: 2px dashed #487b48;
}

.item-icon {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    user-select: none;
    pointer-events: none;
}

.item-fallback {
    font-size: 12px;
    font-weight: 900;
    pointer-events: none;
}

.item-quantity {
    position: absolute;
    bottom: -1px;
    right: -2px;
    font-size: 12px;
    font-weight: 900;
    line-height: 1;
    color: #fff;
    pointer-events: none;
    text-shadow: -1px -1px #34243e, 1px -1px #34243e,
                  -1px 1px #34243e, 1px 1px #34243e;
}

.inventory-info {
    min-height: 48px;
    margin-top: 11px;
    padding: 9px 8px 0;
    border-top: 2px solid #b49bc7;
    font-size: 13px;
}

.inventory-hint {
    margin-top: 5px;
    font-size: 12px;
    color: #685576;
}

/* right click item menu */
.item-menu {
    position: fixed;
    z-index: 40;
    width: 218px;
    padding: 11px;
    border: 3px solid #674d80;
    border-radius: 11px 4px 11px 4px;
    background: #f0e5fa;
    color: #3b2949;
    box-shadow: 4px 4px 0 #24162f;
}

.item-menu-title {
    font-size: 14px;
    font-weight: 900;
    margin-bottom: 5px;
}

.item-menu-description {
    font-size: 11px;
    margin-bottom: 10px;
    color: #685474;
}

.item-menu-actions {
    display: grid;
    gap: 6px;
}

.item-menu button {
    padding: 8px;
    border: 2px solid #7d638f;
    border-radius: 6px 2px 6px 2px;
    background: #ddcbed;
    color: #3b2949;
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
}

.chat-name {
    cursor: pointer;
}

.chat-name:hover {
    text-decoration: underline;
}

.item-menu button:hover { background: #fef4ff; }
.item-menu button.danger { border-color: #af647b; color: #853448; }
.item-menu button.confirm { background: #ffe2dd; }

#playerProfile {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    padding: 20px;
    background: #eee6fa;
    border: 3px solid #927bb5;
    border-radius: 10px;
    color: #45365c;
    text-align: center;
    z-index: 9999;
}

#playerProfile button {
    display: block;
    margin: 8px auto;
    cursor: pointer;
}

#closeProfile {
    position: absolute;
    top: 0;
    right: 10px;
}

.chat-name {
    cursor: pointer;
}

#gameContainer {
    position: fixed;
    inset: 0;
}

#crafting-button {
    position: fixed;
    left: calc(50% + 316px);
    bottom: 10px;
    width: 64px;
    height: 64px;
    z-index: 11;
    background-color: rgba(100, 70, 140, 0.5);
    border: 1px solid #250E34;
    color: #D9FDA6;
    cursor: pointer;
}

#crafting-button span {
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
}

#crafting-button img {
    width: 40px;
    height: 40px;
    image-rendering: pixelated;
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
}
    

#profileMenu {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10000;
    font: bold 13px ui-monospace, "Courier New", monospace;
    color: #42334f;
}
#profileMenu [hidden] { display: none !important; }
#profileMenu button {
    font: inherit;
    cursor: pointer;
    border: 2px solid #624680;
    border-radius: 0;
}
#profileButton {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #eee1f8;
    color: #42334f;
    padding: 9px 12px;
    box-shadow: 0 3px 0 #624680;
}
#profileIcon { width: 19px; height: 19px; fill: currentColor; }
#profileDropdown {
    position: absolute;
    top: calc(100% + 9px);
    right: 0;
    min-width: 180px;
    padding: 12px;
    border: 2px solid #624680;
    box-shadow: 0 3px 0 #624680;
    background: #fbf6ff;
}
#profileUsername { display: block; margin-bottom: 11px; overflow-wrap: anywhere; }
#logoutButton {
    width: 100%; padding: 8px; background: #e6c9d5; color: #753b55;
    border-color: #a76581 !important;
}
#logoutButton:hover:not(:disabled) { background: #dcb3c6; }
#profileMenu button:focus-visible { outline: 3px solid #a989d0; outline-offset: 2px; }
#profileMenu button:disabled { opacity: .6; cursor: wait; }
#profileError { font-size: 11px; margin: 8px 0 0; }
#profileError:empty { display: none; }

/* chat */
#chat {
    position: fixed;
    left: 24px;
    bottom: 24px;
    width: min(360px, calc(100vw - 48px));
    height: min(500px, 48vh);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: rgba(36, 24, 54, 0.88);
    border: 2px solid #9473b3;
    border-radius: 12px 5px 12px 5px;
    box-shadow: 4px 5px 0 rgba(25, 14, 37, 0.5), inset 0 1px 0 #b89bcf;
    color: #f8edff;
    font: 600 13px/1.45 ui-monospace, Menlo, Consolas, monospace;
    z-index: 12;
    pointer-events: none;
}
#chat:focus-within { border-color: #e0b8ff; background: rgba(36, 24, 54, 0.96); }
#chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    background: rgba(105, 68, 137, 0.6);
    border-bottom: 1px solid #9473b3;
    font-size: 13px;
    letter-spacing: 0.4px;
}
#chat-hint { font-size: 10px; color: #cdb4de; font-weight: 500; }
#chat-messages {
    flex: 1;
    min-height: 0;
    padding: 10px 12px;
    overflow-y: auto;
    overflow-wrap: anywhere;
    scrollbar-color: #8f6baa transparent;
    scrollbar-width: thin;
    pointer-events: auto;
}
.chat-message { margin: 0 0 7px; }
.chat-message .chat-name { color: #f4d49a; }
.chat-message.system { color: #bfa9d2; font-style: italic; font-weight: 500; }
#chatbox {
    display: flex;
    gap: 7px;
    padding: 9px;
    background: #21152f;
    border-top: 1px solid #72548b;
    pointer-events: auto;
}
#chat-input {
    flex: 1;
    min-width: 0;
    padding: 9px 10px;
    background: #39274d;
    border: 1px solid #82629e;
    border-radius: 6px 2px 6px 2px;
    color: #fff5ff;
    outline: none;
    font: inherit;
}
#chat-input::placeholder { color: #b49bc7; }
#chat-input:focus { border-color: #e0b8ff; background: #48305e; }
#chat-send {
    padding: 0 12px;
    border: 1px solid #d6aaf2;
    border-radius: 5px 2px 5px 2px;
    background: #8659aa;
    color: white;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
}
#chat-send:hover:not(:disabled) { background: #a06bc9; }
#chat-send:disabled { opacity: 0.55; cursor: default; }

@media (max-width: 390px) {
    .inventory-grid { gap: 3px; padding: 5px; }
    .inventory-panel { padding: 9px; }
    .inventory-heading { font-size: 15px; }
    .inventory-heading small { font-size: 10px; }
    .inventory-slot { border-width: 1px; }
    .item-quantity { font-size: 10px; }
    .hotbar-slot .item-quantity { font-size: 10px; }
    .hotbar-number { font-size: 8px; }
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="profileMenu" hidden>
    <button id="profileButton" type="button" aria-expanded="false" aria-controls="profileDropdown">
        <svg id="profileIcon" viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges">
            <path d="M5 1h6v1h1v6h-1v1H5V8H4V2h1zM4 10h8v1h2v4H2v-4h2z"/>
        </svg>
        <span id="profileButtonName">Profile</span>
        <span aria-hidden="true">▾</span>
    </button>
    <div id="profileDropdown" hidden>
        <span id="profileUsername"></span>
        <button id="logoutButton" type="button">Log out</button>
        <p id="profileError" role="alert"></p>
    </div>
</div>

<!-- chat -->
<div id="chat">
    <div id="chat-header"><span>Global Chat</span><span id="chat-hint"></span></div>
    <div id="chat-messages" role="log" aria-live="polite">
    </div>
    <form id="chatbox" autocomplete="off">
        <input id="chat-input" type="text" maxlength="250" placeholder="Type a message..." aria-label="Chat message">
        <button id="chat-send" type="submit">Send</button>
    </form>
</div>

<div class="game-ui">
    <div class="hud">
        <kbd>E</kbd> Inventory
    </div>

    <div class="prompt-area">
        <div class="pickup-label" id="pickup-prompt" hidden>
            <kbd>C</kbd> Pick up <span id="pickup-name">Basic Egg</span>
        </div>
    </div>

    <div class="toast-area">
        <div class="toast" id="toast" hidden></div>
    </div>

    <div class="hotbar" id="hotbar" aria-label="Hotbar"></div>

    <div class="inventory-screen" id="inventory-screen" hidden>
        <section class="inventory-panel"
                 role="dialog"
                 aria-label="Inventory"
                 aria-modal="true">

            <div class="inventory-heading">
                <span>Inventory</span>
            </div>

            <div class="inventory-grid" id="inventory-grid"></div>

            <div class="inventory-section-title">Hotbar</div>
            <div class="inventory-grid" id="inventory-hotbar-grid"></div>


            <div class="inventory-info" id="inventory-description"></div>
        </section>
    </div>

    <div class="item-menu" id="item-menu" role="dialog" aria-label="Item options" hidden>
        <div class="item-menu-title" id="item-menu-title"></div>
        <div class="item-menu-description" id="item-menu-description"></div>
        <div class="item-menu-actions">
            <button type="button" id="item-menu-drop">Drop stack</button>
            <button type="button" class="danger" id="item-menu-delete">Delete forever</button>
            <button type="button" id="item-menu-cancel">Cancel</button>
        </div>
    </div>
</div>

<div id="playerProfile" hidden>
    <button id="closeProfile" onclick="closePlayerProfile()">×</button>
    <h2 id="profileUsername"></h2>
    <button>Send Friend Request</button>
    <button>Send Message</button>
    <button>Request Trade</button>
</div>

<button id="crafting-button">
    <span>Craft</span>
    <img src="crafting-button.png">
</button>

<script>
"use strict";


function openPlayerProfile(name) {
    document.getElementById("profileUsername").textContent = name;
    document.getElementById("playerProfile").hidden = false;
}

function closePlayerProfile() {
    document.getElementById("playerProfile").hidden = true;
}

// settings
let freezePlayer = false;

let developerMode = false;

const TILE_SIZE = 16;
const PIXEL_SCALE = 3;
const WALK_SPEED = 70;
const SPRINT_SPEED = 125;
const PLAYER_SPRITE_SIZE = 32;
const WALK_FRAME_DISTANCE = TILE_SIZE / 1.5;

// sleeping settings 
const IDLE_SECONDS = 300;
const SLEEP_Z_DELAY_SECONDS = 3;
const SLEEP_Z_FLOAT_SECONDS = 2.8;
const SLEEP_Z_INTERVAL_SECONDS = SLEEP_Z_FLOAT_SECONDS / 2;

// the resting texture is 32x32, unlike the normal 16x16 player sprites
const RESTING_SPRITE_SIZE = 32;
const SLEEP_Z_MIN_SIZE = 6;
const SLEEP_Z_MAX_SIZE = 12;
const SLEEP_Z_START_X = 5;
const SLEEP_Z_START_Y = -16;


const EGG_RARITY = 700;
const EGG_PICKUP_DISTANCE = 25;

const TREE_PUNCH_DISTANCE = 30;
const TREE_CELL_TILES = 8;
const TREE_CHANCE_PERCENT = 45;
const TREE_SIZE = 64;
const TREE_TRUNK_HALF_WIDTH = 16;
const TREE_TRUNK_DEPTH = 10;

const TREE_PUNCH_FPS = 16;
const TREE_PUNCH_FRAME_COUNT = 9;
const TREE_PUNCH_DURATION = TREE_PUNCH_FRAME_COUNT / TREE_PUNCH_FPS;

// each axe needs this many hits when used alone on an untouched tree
const TREE_CUT_HEALTH = 60;
const AXE_HIT_RANGES = {
    "axe-level-1": [5, 5],
    "axe-level-2": [3, 4],
    "axe-level-3": [1, 3]
};
const CUT_TREES_SAVE_KEY = "pixelPetGame.cutTrees.v1";

const HOTBAR_SLOTS = 9;
const INVENTORY_SLOTS = 54;
const SAVE_KEY = "pixelPetGame.inventory.v3";
const PREVIOUS_SAVE_KEY = "pixelPetGame.inventory.v2";
const LEGACY_SAVE_KEY = "pixelPetGame.eggsAndInventory.v1";

const malePunchingLeft = loadImage(
    "characters/male/male-punching.png"
);

const malePunchingRight = loadImage(
    "characters/male/male-punching-right.png"
);


function drawPlayerSpriteFrame(
    image, frame, x, y, size = 32
) {
    const frameSize = 16;

    ctx.drawImage(
        image,
        frame * frameSize, 0,
        frameSize, frameSize,
        x, y,
        size, size
    );
}

function drawCraftSpriteFrame(image, frame, x, y) {
    ctx.drawImage(
        image,
        frame * 16, 0,
        16, 24,
        x, y - 16,
        32, 48
    );
}
    
// shadows
function drawShadow(ctx, x, y, width, height, options = {}) {
    const {
        enabled = true,
        opacity = 0.25,
        scale = 0.7,
        offsetX = 0,
        offsetY = -2
    } = options;

    if (!enabled) return;

    ctx.save();
    ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`;
    ctx.beginPath();

    ctx.ellipse(
        x + width / 2 + offsetX,
        y + height + offsetY,
        width * scale / 2,
        Math.max(1, height * 0.12),
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.restore();
}
// items
const ITEM_DEFINITIONS = {
    "basic-egg": {
        name: "Basic Egg",
        nameColor: "#ffffff",
        icon: "items/basic-egg.png",
        maxStack: 52
    },
    "axe-level-1": {
        name: "Axe ʟᴇᴠᴇʟ 1",
        nameColor: "#ffffff",
        icon: "items/axe-level-1.png",
        maxStack: 1,
    },
    "axe-level-2": {
        name: "Axe ʟᴇᴠᴇʟ 2",
        nameColor: "#FCAED9",
        icon: "items/axe-level-2.png",
        maxStack: 1,
    },
    "axe-level-3": {
        name: "Axe ʟᴇᴠᴇʟ 3",
        nameColor: "#F9D895",
        icon: "items/axe-level-3.png",
        maxStack: 1,
    },
    "wood": {
        name: "Wood",
        nameColor: "#C99B6A",
        icon: "items/log.png",
        maxStack: 64
    }
};

function getItemDefinition(itemId) {
    return ITEM_DEFINITIONS[itemId] || {
        name: itemId
            .replace(/[-_]/g, " ")
            .replace(/\b\w/g, char => char.toUpperCase()),
        icon: `items/${itemId}.png`,
        maxStack: 52
    };
}
// setup
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });
const keys = new Set();
const chatInput = document.getElementById("chat-input");
const chatForm = document.getElementById("chatbox");
const chatMessages = document.getElementById("chat-messages");
const chatHint = document.getElementById("chat-hint");
const chatSend = document.getElementById("chat-send");
let chatStream = null;
let chatConnected = false;
let chatSending = false;
let chatCheckingSession = false;

function updateChatStatus(status) {
    chatHint.textContent = status;
    chatSend.disabled = !chatConnected || chatSending;
}



function connectGlobalChat() {
    if (chatStream) return;
    chatConnected = false;
    updateChatStatus("Connecting...");
    const stream = new EventSource("/api/chat/stream");
    chatStream = stream;

    stream.onopen = () => {
        if (chatStream !== stream) return;
        chatConnected = true;
        updateChatStatus("Connected");
    };

    stream.onmessage = event => {
        if (chatStream !== stream) return;
        try {
            const { username, message } = JSON.parse(event.data);
            if (typeof username === "string" && typeof message === "string") {
                addChatMessage(message, username);
            }
        } catch (error) {
            console.error("Invalid chat message:", error);
        }
    };

    stream.addEventListener("session-expired", () => {
        if (chatStream !== stream) return;
        disconnectGlobalChat();
        window.location.replace("/index.html");
    });

    stream.onerror = async () => {
        if (chatStream !== stream) return;
        chatConnected = false;
        updateChatStatus("Reconnecting...");
        if (chatCheckingSession) return;
        chatCheckingSession = true;
        try {
            const response = await fetch("/api/session", { cache: "no-store" });
            if (response.status === 401 && chatStream === stream) {
                disconnectGlobalChat();
                window.location.replace("/index.html");
            }
        } catch {
            // EventSource automatically retries interrupted connections
        } finally {
            chatCheckingSession = false;
            if (chatStream === stream && stream.readyState === EventSource.CLOSED) {
                disconnectGlobalChat();
                setTimeout(() => {
                    if (!chatStream && window.username) connectGlobalChat();
                }, 3000);
            }
        }
    };
}

function disconnectGlobalChat() {
    chatStream?.close();
    chatStream = null;
    chatConnected = false;
    updateChatStatus("Disconnected");
}

updateChatStatus("Connecting...");

function isTypingInChat() {

function addChatMessage(message, name) {
    const line = document.createElement("div");
    line.className = "chat-message";

    const sender = document.createElement("span");
    sender.className = "chat-name";
    sender.textContent = name + " » ";

    sender.addEventListener("click", () => {
        openPlayerProfile(name);
    });

    line.append(sender, document.createTextNode(message));
    chatMessages.appendChild(line);

    while (chatMessages.childElementCount > 150) {
        chatMessages.firstElementChild.remove();
    }

    chatMessages.scrollTop = chatMessages.scrollHeight;
}
    
chatForm.addEventListener("submit", async event => {
    event.preventDefault();
    const original = chatInput.value;
    const message = original.trim();
    if (!message || !chatConnected || chatSending) return;

    chatSending = true;
    updateChatStatus("Sending...");
    try {
        const response = await fetch("/api/chat/messages", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
        });
        if (response.status === 401) {
            disconnectGlobalChat();
            window.location.replace("/index.html");
            return;
        }
        if (!response.ok) {
            const data = await response.json();
            throw new Error(data.error || "Could not send message.");
        }
        // The server broadcasts the message back to us too
        if (chatInput.value === original) chatInput.value = "";
    } catch (error) {
        showMessage(error.message || "Could not send message.");
    } finally {
        chatSending = false;
        updateChatStatus(chatConnected ? "Connected" : "Disconnected");
    }
});

// save / load
function saveGame() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            inventory,
            collectedEggs: Array.from(collectedEggs),
            droppedItems,
            selectedHotbarSlot
        }));
    } catch (error) {
        console.warn("Unable to save game:", error);
    }
}

function loadGame() {
    try {
        let source = SAVE_KEY;
        let raw = localStorage.getItem(SAVE_KEY);

        if (!raw) {
            source = PREVIOUS_SAVE_KEY;
            raw = localStorage.getItem(source);
        }

        if (!raw) {
            source = LEGACY_SAVE_KEY;
            raw = localStorage.getItem(source);
        }

        if (!raw) return;

        const data = JSON.parse(raw);

        if (Array.isArray(data.inventory)) {
            for (let i = 0; i < Math.min(INVENTORY_SLOTS, data.inventory.length); i++) {
                const old = data.inventory[i];
                if (!old) continue;

                const oldId = old.itemId || old.type;
                const itemId = oldId === "egg" ? "basic-egg" : oldId;
                if (!validItemId(itemId)) continue;

                const limit = getItemDefinition(itemId).maxStack;
                if (!Number.isInteger(old.count) || old.count < 1 || old.count > limit) continue;

                inventory[i] = { itemId, count: old.count };
            }
        }

        if (Array.isArray(data.collectedEggs)) {
            for (const key of data.collectedEggs) {
                if (typeof key === "string") collectedEggs.add(key);
            }
        }

        if (Array.isArray(data.droppedItems)) {
            for (const item of data.droppedItems) {
                if (!item || !validItemId(item.itemId)) continue;
                if (!Number.isFinite(item.x) || !Number.isFinite(item.y)) continue;
                if (!Number.isInteger(item.count) || item.count <= 0) continue;
                if (!Number.isInteger(item.id) || item.id < 1) continue;

                droppedItems.push({
                    id: item.id,
                    itemId: item.itemId,
                    x: item.x,
                    y: item.y,
                    count: item.count
                });
                nextDropId = Math.max(nextDropId, item.id + 1);
            }
        }

        if (Number.isInteger(data.selectedHotbarSlot)) {
            selectedHotbarSlot = Math.max(0, Math.min(8, data.selectedHotbarSlot));
        }

        if (source !== SAVE_KEY) saveGame();
    } catch (error) {
        console.warn("Unable to load saved game:", error);
    }
}

// items and inventory
function validItemId(itemId) {
    return typeof itemId === "string" && /^[a-z0-9_-]+$/i.test(itemId);
}

function getItemTexture(itemId) {
    if (!itemTextures.has(itemId)) {
        itemTextures.set(itemId, loadImage(getItemDefinition(itemId).icon));
    }
    return itemTextures.get(itemId);
}

function addInventoryItem(itemId, amount = 1) {
    if (!validItemId(itemId) || !Number.isInteger(amount) || amount <= 0) return false;

    const limit = getItemDefinition(itemId).maxStack;
    let capacity = 0;

    for (const slot of inventory) {
        if (!slot) capacity += limit;
        else if (slot.itemId === itemId) capacity += Math.max(0, limit - slot.count);
    }

    if (capacity < amount) return false;

    // fill existing stacks first
    for (const slot of inventory) {
        if (!slot || slot.itemId !== itemId || amount === 0) continue;
        const moved = Math.min(limit - slot.count, amount);
        slot.count += moved;
        amount -= moved;
    }

    // then fill empty slots
    for (let i = 0; i < inventory.length && amount > 0; i++) {
        if (inventory[i]) continue;
        const moved = Math.min(limit, amount);
        inventory[i] = { itemId, count: moved };
        amount -= moved;
    }

    saveGame();
    renderInventory();
    renderHotbar();
    return true;
}

function moveInventoryItem(from, to) {
    if (!Number.isInteger(from) || !Number.isInteger(to)) return;
    if (from < 0 || to < 0 || from >= INVENTORY_SLOTS || to >= INVENTORY_SLOTS) return;
    if (from === to || !inventory[from]) return;

    const first = inventory[from];
    const second = inventory[to];

    if (second && second.itemId === first.itemId) {
        const limit = getItemDefinition(first.itemId).maxStack;
        const moved = Math.max(0, Math.min(limit - second.count, first.count));
        second.count += moved;
        first.count -= moved;
        if (first.count <= 0) inventory[from] = null;
    } else {
        inventory[from] = second;
        inventory[to] = first;
    }

    saveGame();
    renderInventory();
    renderHotbar();
}

function selectHotbarSlot(index) {
    if (!Number.isInteger(index) || index < 0 || index >= HOTBAR_SLOTS) return;
    selectedHotbarSlot = index;
    saveGame();
    renderHotbar();
    if (inventoryOpen) renderInventory();
}

function getHeldItem() {

}

function clickInventorySlot(index) {
    closeItemMenu();

    if (selectedSlot === -1) {
        if (inventory[index]) selectedSlot = index;
    } else if (selectedSlot === index) {
        selectedSlot = -1;
    } else {
        const from = selectedSlot;
        selectedSlot = -1;
        moveInventoryItem(from, index);
    }

    renderInventory();
}

function createItemIcon(itemId) {

        const fallback = document.createElement("span");
        fallback.className = "item-fallback";
        fallback.textContent = def.name.slice(0, 2).toUpperCase();
        icon.replaceWith(fallback);
    }, { once: true });

    return icon;
}

function fillSlot(button, index) {
    const slot = inventory[index];
    if (!slot) return;

    const def = getItemDefinition(slot.itemId);
    button.title = `${def.name} ×${slot.count}`;
    button.setAttribute("aria-label", `${def.name} x${slot.count}, slot ${index + 1}`);
    button.appendChild(createItemIcon(slot.itemId));

    if (slot.count > 1) {
        const count = document.createElement("span");
        count.className = "item-quantity";
        count.textContent = String(slot.count);
        button.appendChild(count);
    }

    button.addEventListener("contextmenu", event => {
        event.preventDefault();
        event.stopPropagation();
        showItemMenu(index, event.clientX, event.clientY);
    });
}

function createInventorySlot(index) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "inventory-slot";
    if (selectedSlot === index) button.classList.add("selected");
    if (index === selectedHotbarSlot) button.classList.add("hotbar-equipped");
    button.setAttribute("aria-label", `Inventory slot ${index + 1}`);

    fillSlot(button, index);
    button.draggable = Boolean(inventory[index]);

    button.addEventListener("click", () => clickInventorySlot(index));
    button.addEventListener("dragstart", event => {
        if (!inventory[index]) {
            event.preventDefault();
            return;
        }
        closeItemMenu();
        draggedSlot = index;
        event.dataTransfer.setData("text/plain", String(index));
        event.dataTransfer.effectAllowed = "move";
    });

    button.addEventListener("dragover", event => {
        if (draggedSlot < 0) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        button.classList.add("drag-over");
    });

    button.addEventListener("dragleave", () => button.classList.remove("drag-over"));

    button.addEventListener("drop", event => {
        event.preventDefault();
        const from = draggedSlot;
        draggedSlot = -1;
        selectedSlot = -1;
        if (from !== -1) moveInventoryItem(from, index);
        button.classList.remove("drag-over");
    });

    button.addEventListener("dragend", () => {
        draggedSlot = -1;
        document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
    });

    return button;
}

function renderInventory() {
    if (!inventoryOpen) return;

    const backpack = document.createDocumentFragment();
    const hotbar = document.createDocumentFragment();

    for (let i = HOTBAR_SLOTS; i < INVENTORY_SLOTS; i++) {
        backpack.appendChild(createInventorySlot(i));
    }
    for (let i = 0; i < HOTBAR_SLOTS; i++) {
        hotbar.appendChild(createInventorySlot(i));
    }

    ui.grid.replaceChildren(backpack);
    ui.invHotbar.replaceChildren(hotbar);

    const selected = inventory[selectedSlot];
    ui.description.textContent = selected
        ? `${getItemDefinition(selected.itemId).name} ×${selected.count}`
        : `${inventory.filter(Boolean).length} / ${INVENTORY_SLOTS} slots used`;

    ui.description.style.color = selected
        ? (getItemDefinition(selected.itemId).nameColor || "#3B2949")
        : "#3B2949";
}

function renderHotbar() {
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < HOTBAR_SLOTS; i++) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "hotbar-slot" + (i === selectedHotbarSlot ? " active" : "");
        button.setAttribute("aria-label", `Hotbar slot ${i + 1}`);
        button.setAttribute("aria-pressed", String(i === selectedHotbarSlot));
        fillSlot(button, i);

        const number = document.createElement("span");
        number.className = "hotbar-number";
        number.textContent = String(i + 1);
        button.appendChild(number);

        button.addEventListener("click", () => selectHotbarSlot(i));
        fragment.appendChild(button);
    }

    ui.hotbar.replaceChildren(fragment);
}

function spawnDroppedItem(itemId, x = player.x, y = player.y, count = 1) {
    if (!validItemId(itemId) || !Number.isFinite(x) || !Number.isFinite(y)) return null;
    if (!Number.isInteger(count) || count <= 0) return null;

    const item = { id: nextDropId++, itemId, x, y, count };
    droppedItems.push(item);
    getItemTexture(itemId);
    saveGame();
    return item;
}

    selectedSlot = -1;
    closeItemMenu();
    saveGame();
    renderInventory();
    renderHotbar();
    showMessage(`Dropped ${getItemDefinition(item.itemId).name} ×${item.count}`);

function resize() {
    canvas.width = Math.ceil(window.innerWidth / PIXEL_SCALE);
    canvas.height = Math.ceil(window.innerHeight / PIXEL_SCALE);
    ctx.imageSmoothingEnabled = false;
}

class Wiggler {
  constructor(frequency, amplitude) {
    this.frequency = frequency;
    this.amplitude = amplitude;
    this.seed = Math.random() * 1000;
  }

  noise(x) {
    const i = Math.floor(x);
    const f = x - i;
    const u = f * f * (3.0 - 2.0 * f);

    const hash = (n) => (Math.sin(n + this.seed) * 43758.5453123) % 1;
    const a = hash(i) * 2 - 1;
    const b = hash(i + 1) * 2 - 1;

    return a + (b - a) * u;
  }

  getValue(progressInShakes) {
    return this.noise(progressInShakes) * this.amplitude;
  }
}

function shakeElement(element, shakes = 5, frequency = 10, amplitude = 15) {
  const wiggleX = new Wiggler(frequency, amplitude);
  const wiggleY = new Wiggler(frequency, amplitude);
  const duration = shakes / frequency; // 5 shakes at 10/sec = 0.5 seconds
  let startTime = null;

  function animate(timestamp) {
    if (!startTime) startTime = timestamp;
    const elapsedSeconds = (timestamp - startTime) / 1000;

    if (elapsedSeconds < duration) {
      const currentShake = elapsedSeconds * frequency;
      
      // Fade out smoothly on the final shake so it doesn't snap harshly
      const fade = currentShake > shakes - 1 ? shakes - currentShake : 1;

      const x = wiggleX.getValue(currentShake) * fade;
      const y = wiggleY.getValue(currentShake) * fade;

      element.style.transform = `translate(${x}px, ${y}px)`;
      requestAnimationFrame(animate);
    } else {
      element.style.transform = `translate(0px, 0px)`; // Reset cleanly
    }
  }

  requestAnimationFrame(animate);
}

// ground hash
function hash(x, y) {
    let h =
        Math.imul(x, 374761393) +
        Math.imul(y, 668265263);

    h = Math.imul(
        h ^ (h >>> 13),
        1274126177
    );

    return (h ^ (h >>> 16)) >>> 0;
}
// draw ground
function drawGround(cameraX, cameraY) {
    ctx.fillStyle = "#79a66e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const left = Math.floor(cameraX / TILE_SIZE);
    const top = Math.floor(cameraY / TILE_SIZE);

    const right = Math.floor(
        (cameraX + canvas.width) / TILE_SIZE
    ) + 1;

    const bottom = Math.floor(
        (cameraY + canvas.height) / TILE_SIZE
    ) + 1;

    for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
            const px = Math.floor(tx * TILE_SIZE - cameraX);
            const py = Math.floor(ty * TILE_SIZE - cameraY);
            const n = hash(tx, ty);

            if (imageReady(grassTexture)) {
                ctx.drawImage(
                    grassTexture,
                    px, py,
                    TILE_SIZE + 30,
                    TILE_SIZE + 30
                );
            }

            if (n % 13 === 0) {
                ctx.fillStyle = "#98ba7b";
                ctx.fillRect(px + 6, py + 9, 2, 3);
            }

            if (n % 23 === 0) {

function getTreeInCell(cx, cy) {
    const key = `${cx},${cy}`;

    if (cutTrees.has(key)) return null;

    if (treeCache.has(key)) {
        return treeCache.get(key);
    }

    const seed = hash(cx + 17031, cy - 90217);

    if (seed % 100 >= TREE_CHANCE_PERCENT) {
        return null;
    }

    const tx =
        cx * TREE_CELL_TILES + 1 +
        (hash(cx + 317, cy + 991) % (TREE_CELL_TILES - 2));

    const ty =
        cy * TREE_CELL_TILES + 1 +
        (hash(cx - 733, cy + 1441) % (TREE_CELL_TILES - 2));

    const x = tx * TILE_SIZE + TILE_SIZE / 2;
    const y = ty * TILE_SIZE + TILE_SIZE / 2;

    if (isNearPlot(x, y, TREE_SIZE / 2 + 6)) {
        return null;
    }

    if (Math.hypot(x + 16, y + 16) < 48) {
        return null;
    }

    const tree = {
        key,
        cx,
        cy,
        x,
        y,
        punching: false,
        cutting: false,
        cutDamage: 0,
        animation: null
    };

    treeCache.set(key, tree);

    return tree;
}

function getTreesInBounds(left, top, right, bottom) {
    const cellSize = TREE_CELL_TILES * TILE_SIZE;
    const trees = [];

    for (
        let cy = Math.floor(top / cellSize);
        cy <= Math.floor(bottom / cellSize);
        cy++
    ) {
        for (
            let cx = Math.floor(left / cellSize);
            cx <= Math.floor(right / cellSize);
            cx++
        ) {
            const tree = getTreeInCell(cx, cy);

            if (
                tree &&
                tree.x >= left &&
                tree.x <= right &&
                tree.y >= top &&
                tree.y <= bottom
            ) {
                trees.push(tree);
            }
        }
    }

    return trees;
}
// tree collision
function isTreeSolid(x, y) {
    const cellSize = TREE_CELL_TILES * TILE_SIZE;
    const cx = Math.floor(x / cellSize);
    const cy = Math.floor(y / cellSize);

    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            const tree = getTreeInCell(cx + dx, cy + dy);

            if (!tree) continue;

            if (
                Math.abs(x - tree.x) <= TREE_TRUNK_HALF_WIDTH &&
                y >= tree.y - TREE_TRUNK_DEPTH &&
                y <= tree.y
            ) {
                return true;
            }
        }
    }

    return false;
}

function getTreeShakeFlip(tree) {
    if (player.facing === "up") return true;

// trees differ in hardness, but each axe always stays in its promised hit range
function getTreeHitsForAxe(tree, axeId) {
    const range = AXE_HIT_RANGES[axeId];
    if (!range) return null;
    const [minHits, maxHits] = range;
    if (minHits === maxHits) return minHits;

    const seed = hash(
        tree.cx + (axeId === "axe-level-2" ? 19317 : 72583),
        tree.cy - (axeId === "axe-level-2" ? 6319 : 29011)
    );
    return minHits + (seed % (maxHits - minHits + 1));
}

async function cutTree(tree) {
    if (!tree || tree.cutting || tree.punching || player.cutting || player.punching) return;
    if (cutTrees.has(tree.key)) return;

    const axeId = getHeldItem()?.itemId;

        if (tree.cutStage === 5) {
            cutTrees.add(tree.key);

            saveCutTrees();
        } else {
            const damage = 60 / hitsRequired;
            tree.cutDamage = Math.min(60, (tree.cutDamage || 0) + damage);

            if (tree.cutDamage >= 60) {
                tree.cutStage = 5;
                spawnDroppedItem("wood", tree.x, tree.y, 2);
                showMessage("Dropped 2 Wood");
            } else {
                tree.cutStage = Math.min(
                    4,
                    Math.floor((tree.cutDamage / TREE_CUT_HEALTH) * 4) + 1
                );

                const hitsLeft = Math.ceil((60 - tree.cutDamage) / damage);
            }
        }


    } finally {

        player.cutting = false;
        player.punching = false;
        freezePlayer = false;
    }
}

async function holdToCutTree(tree) {
    if (autoCutting) return;

    autoCutting = true;

    try {
        while (
            (keys.has("KeyZ") || keys.has("Enter")) &&
            !cutTrees.has(tree.key)
        ) {
            const previousDamage = tree.cutDamage || 0;

            await cutTree(tree);

            if (cutTrees.has(tree.key)) break;

            // Stop if the cut was unsuccessful
            if ((tree.cutDamage || 0) <= previousDamage) break;
        }
    } finally {
        autoCutting = false;
    }

// find nearest tree
function getNearestTree() {
    let nearest = null;

    let nearestDistanceSq =
        TREE_PUNCH_DISTANCE * TREE_PUNCH_DISTANCE;

    const trees = getTreesInBounds(
        player.x - TREE_PUNCH_DISTANCE,
        player.y - TREE_PUNCH_DISTANCE,
        player.x + TREE_PUNCH_DISTANCE,
        player.y + TREE_PUNCH_DISTANCE
    );

    for (const tree of trees) {
        const dx = tree.x - player.x;
        const dy = tree.y - player.y;

        const distanceSq = dx * dx + dy * dy;

        if (distanceSq <= nearestDistanceSq) {
            nearest = tree;
            nearestDistanceSq = distanceSq;
        }
    }

    return nearest;
}

        isTreeSolid(x + halfW, y + halfH)
    );

function drawSleepingZs(screenX, screenY) {
    if (player.restingSince === null || !imageReady(sleepingZTexture)) return;

    const elapsed =
        (performance.now() - player.restingSince) / 1000 - SLEEP_Z_DELAY_SECONDS;

    if (elapsed < 0) return;

    const latestZ = Math.floor(elapsed / SLEEP_Z_INTERVAL_SECONDS);

    // a new Z appears when the previous one is halfway through its float
    for (let i = Math.max(0, latestZ - 2); i <= latestZ; i++) {
        const age = elapsed - i * SLEEP_Z_INTERVAL_SECONDS;
        if (age < 0 || age >= SLEEP_Z_FLOAT_SECONDS) continue;

        const t = age / SLEEP_Z_FLOAT_SECONDS;
        const glide = t * t * (3 - 2 * t);
        const swell = Math.sin(Math.PI * t);
        const size = SLEEP_Z_MIN_SIZE + (SLEEP_Z_MAX_SIZE - SLEEP_Z_MIN_SIZE) * swell;
        const opacity = 0.82 * Math.min(1, t / 0.18, (1 - t) / 0.32);

        const x = screenX + SLEEP_Z_START_X + 15 * glide + Math.sin(t * Math.PI * 2) * 0.8;
        const y = screenY + SLEEP_Z_START_Y - 26 * glide;

        ctx.save();
        ctx.globalAlpha = Math.max(0, opacity);
        ctx.drawImage(
            sleepingZTexture,
            Math.round(x - size / 2),
            Math.round(y - size / 2),
            Math.round(size),
            Math.round(size)
        );
        ctx.restore();
    }
}

// update game
function update(dt) {
    gameTime += dt;
    updateRestingState();
    updateUI(dt);

    if (inventoryOpen) {
        player.moving = false;
        player.walkDistance = 0;
        player.walkFrame = 0;
        return;
    }

    if (player.punching || player.cutting) {
        player.moving = false;
        return;
    }            
        
    const inputX =
        Number(
            keys.has("KeyD") ||
            keys.has("ArrowRight")
        ) -
        Number(
            keys.has("KeyA") ||
            keys.has("ArrowLeft")
        );

    const inputY =
        Number(
            keys.has("KeyS") ||
            keys.has("ArrowDown")
        ) -
        Number(
            keys.has("KeyW") ||
            keys.has("ArrowUp")
        );

    if (inputX === 0 && inputY === 0) {
        player.moving = false;
        player.walkDistance = 0;
        player.walkFrame = 0;
        return;
    }

    // trying to move wakes the player even if a tree blocks the way
    wakePlayer();

    const length = Math.hypot(inputX, inputY);

    const dx = inputX / length;
    const dy = inputY / length;

    const speed =
        keys.has("ControlLeft")
            ? SPRINT_SPEED
            : WALK_SPEED;

    const moveX = dx * speed * dt;
    const moveY = dy * speed * dt;

    const previousX = player.x;
    const previousY = player.y;

    if (canMoveTo(player.x + moveX, player.y)) {
        player.x += moveX;
    }

    if (canMoveTo(player.x, player.y + moveY)) {
        player.y += moveY;
    }

    if (inputY !== 0) {
        player.facing = inputY > 0 ? "down" : "up";
    } else {
        player.facing = inputX > 0 ? "right" : "left";
    }

    const distanceMoved = Math.hypot(
        player.x - previousX,
        player.y - previousY
    );

    player.moving = distanceMoved > 0.0001;

    if (player.moving) {
        player.walkDistance += distanceMoved;

        player.walkFrame = Math.floor(
            player.walkDistance / WALK_FRAME_DISTANCE
        ) % 2;
    } else {
        player.walkDistance = 0;
        player.walkFrame = 0;
    }
}

    drawGround(cameraX, cameraY);
    drawEggs(cameraX, cameraY);
    drawDroppedItems(cameraX, cameraY);

    const trees = getTreesInBounds(
        cameraX - TREE_SIZE,
        cameraY - TREE_SIZE,
        cameraX + canvas.width + TREE_SIZE,
        cameraY + canvas.height + TREE_SIZE
    );

    for (const tree of trees) {
        if (tree.y <= player.y) {
            drawTree(tree, cameraX, cameraY);
        }
    }

    drawPlayer(
        Math.floor(canvas.width / 2),
        Math.floor(canvas.height / 2)
    );

    for (const tree of trees) {
        if (tree.y > player.y) {
            drawTree(tree, cameraX, cameraY);
        }
    }

    drawHitboxes(cameraX, cameraY);
}
// game loop
let lastTime = performance.now();

function gameLoop(now) {
    const dt = Math.min(
        (now - lastTime) / 1000,
        0.05
    );

    lastTime = now;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
// controls
window.addEventListener("keydown", (event) => {
    if (isTypingInChat()) return;
    if (event.code === "KeyT" && !event.repeat && !inventoryOpen && !event.ctrlKey && !event.altKey && !event.metaKey) {
        event.preventDefault();
        keys.clear();
        chatInput.focus();
        return;
    }
    if (!event.repeat) wakePlayer();

    if (event.ctrlKey && event.code === "KeyK") {
        event.preventDefault();
    
        if (!event.repeat) {
            craftItem("axe");
        }
    }

    if (event.ctrlKey && event.code === "KeyO") {
        event.preventDefault();

        if (!event.repeat) {
            developerMode = !developerMode;

            console.log(
                "Developer Mode:",
                developerMode ? "ON" : "OFF"
            );
        }

        return;
    }

    if (
        [
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
        ].includes(event.code)
    ) {
        event.preventDefault();
    }

    if (event.code === "Escape" && !ui.menu.hidden) {
        event.preventDefault();
        closeItemMenu();
        return;
    }

    if (!event.ctrlKey && !event.altKey && !event.metaKey && /^Digit[1-9]$/.test(event.code)) {
        event.preventDefault();
        if (!event.repeat) selectHotbarSlot(Number(event.code.slice(-1)) - 1);
        return;
    }

    if (
        event.code === "KeyE" ||
        event.code === "Escape"
    ) {
        event.preventDefault();

        if (!event.repeat) {
            if (event.code === "KeyE") {
                toggleInventory();
            } else if (inventoryOpen) {
                toggleInventory(false);
            }
        }

        return;
    }

    if (inventoryOpen) return;

    if (event.code === "KeyZ" || event.code === "Space") {
        event.preventDefault();
    
        keys.add(event.code);
    
        if (!event.repeat) {
            const tree = getNearestTree();
    
            if (tree) {
                const heldItemId = getHeldItem()?.itemId;
    
                if (AXE_HIT_RANGES[heldItemId]) {
                    holdToCutTree(tree);
                } else {
                    punchTree(tree);
                }
            }
        }
    
        return;
    }

    if (event.code === "KeyX" || event.code === "KeyC") {
        event.preventDefault();

        if (!event.repeat) {
            collectNearbyItem();
        }

        return;
    }

    if (!keys.has(event.code)) {
        if (
            event.code === "KeyD" ||
            event.code === "ArrowRight"
        ) {
            player.forwardSide = "right";
        } else if (
            event.code === "KeyA" ||
            event.code === "ArrowLeft"
        ) {
            player.forwardSide = "left";
        }
        
    }

    keys.add(event.code);
});

window.addEventListener("keydown", (event) => {
    if (isTypingInChat()) return;
    if (event.code === "KeyF") {
        console.log("User pressed the F key... very cool!");
    }
});

window.addEventListener("keyup", (event) => {
    keys.delete(event.code);
});

window.addEventListener("pointerdown", (event) => {
    if (!event.target.closest("#chat")) wakePlayer();
});

window.addEventListener("blur", () => {
    keys.clear();

    player.moving = false;
    player.walkDistance = 0;
    player.walkFrame = 0;
});
// developer hitbox rendering
function drawHitboxes(cameraX, cameraY) {
    if (!developerMode) return;

    ctx.save();
    ctx.lineWidth = 1;

    ctx.strokeStyle = "#ff0000";

    ctx.strokeRect(
        Math.round(player.x - player.width / 2 - cameraX),
        Math.round(player.y - player.height / 2 - cameraY),
        player.width,
        player.height
    );

    const trees = getTreesInBounds(
        cameraX - TREE_SIZE,
        cameraY - TREE_SIZE,
        cameraX + canvas.width + TREE_SIZE,
        cameraY + canvas.height + TREE_SIZE
    );

    ctx.strokeStyle = "#0088ff";

    for (const tree of trees) {
        ctx.strokeRect(
            Math.round(tree.x - TREE_TRUNK_HALF_WIDTH - cameraX),
            Math.round(tree.y - TREE_TRUNK_DEPTH - cameraY),
            TREE_TRUNK_HALF_WIDTH * 2,
            TREE_TRUNK_DEPTH
        );
    }

    ctx.restore();
}
window.username = null;
    window.profileReady = (async () => {
        const menu = document.getElementById("profileMenu");
        const button = document.getElementById("profileButton");
        const dropdown = document.getElementById("profileDropdown");
        const logoutButton = document.getElementById("logoutButton");
        const errorMessage = document.getElementById("profileError");
        let expiryTimer;

        function closeMenu() {
            dropdown.hidden = true;
            button.setAttribute("aria-expanded", "false");
        }
        function goToLogin() {
            window.username = null;
            disconnectGlobalChat();
            window.location.replace("index.html");
        }
        async function checkSession() {
            const response = await fetch("/api/session", { credentials: "same-origin", cache: "no-store" });
            if (response.status === 401) {
                goToLogin();
                return null;
            }
            if (!response.ok) throw new Error("Could not load your profile.");
            const session = await response.json();
            window.username = session.username;
            connectGlobalChat();
            document.getElementById("profileButtonName").textContent = window.username;
            document.getElementById("profileUsername").textContent = "Signed in as " + window.username;
            errorMessage.textContent = "";
            menu.hidden = false;
            clearTimeout(expiryTimer);
            expiryTimer = setTimeout(() => {
                // Ask the server at expiry in case another tab logged in again.
                checkSession().catch(goToLogin);
            }, Math.max(1000, session.expiresAt - Date.now() + 1000));
            return window.username;
        }

        button.addEventListener("click", () => {
            dropdown.hidden = !dropdown.hidden;
            button.setAttribute("aria-expanded", String(!dropdown.hidden));
        });
        document.addEventListener("click", event => {
            if (!menu.contains(event.target)) closeMenu();
        });
        document.addEventListener("keydown", event => {
            if (event.code === "Escape" && !dropdown.hidden) closeMenu();
        });
        // Prevent profile clicks from being sent to canvas input handlers that use bubbling.
        for (const name of ["pointerdown", "pointerup", "mousedown", "mouseup", "click", "contextmenu"]) {
            menu.addEventListener(name, event => event.stopPropagation());
        }
        logoutButton.addEventListener("click", async () => {
            logoutButton.disabled = true;
            errorMessage.textContent = "";
            try {
                const response = await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
                if (!response.ok) throw new Error();
                goToLogin();
            } catch {
                errorMessage.textContent = "Could not log out. Try again.";
                logoutButton.disabled = false;
            }
        });
        window.addEventListener("focus", () => checkSession().catch(console.error));
        window.addEventListener("pageshow", event => {
            if (event.persisted) checkSession().catch(console.error);
        });

        try {
            return await checkSession();
        } catch (error) {
            console.error(error);
            menu.hidden = false;
            dropdown.hidden = false;
            button.setAttribute("aria-expanded", "true");
            errorMessage.textContent = "Could not load your account. Refresh to retry.";
            return null;
        }
    })();
</script>
